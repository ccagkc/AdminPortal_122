<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>葵涌堂悅曆 · 管理員後台控制台</title>
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="robots" content="noindex, nofollow">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    
    <link rel="stylesheet" href="style.css?v=5">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'serif': ['"Noto Serif TC"', 'serif'],
                        'sans': ['"Noto Sans TC"', 'sans-serif'],
                    },
                    colors: {
                        nature: { 
                            50: 'var(--theme-50)', 100: 'var(--theme-100)', 200: 'var(--theme-200)', 
                            300: 'var(--theme-300)', 400: 'var(--theme-400)', 500: 'var(--theme-500)', 
                            600: 'var(--theme-600)', 700: 'var(--theme-700)', 800: 'var(--theme-800)', 900: 'var(--theme-900)'
                        }
                    },
                    boxShadow: { 'soft': '0 10px 40px -10px rgba(0,0,0,0.05)' },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-out forwards'
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen flex flex-col">
    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SITE_CONFIG = {
            adminEmailDomain: "@admin.kcc.app",
            footerText: "© CCAGKC · CHURCH CALENDAR ADMIN SYSTEM"
        };

        const App = () => {
            const [fb, setFb] = useState(null);
            const [currentUser, setCurrentUser] = useState(null);
            const [userProfile, setUserProfile] = useState(null);
            const [loading, setLoading] = useState(true);

            const [appSettings, setAppSettings] = useState({ groups: ['未入組/其他', '少年崇拜', '奇行組', 'IMA組', '加利利奮青', '彼得組', '隨意行組', '葡萄果組', 'Spectrum組', '家靈一組', '7-11組', '清心組', 'ReConnect組', '基順ECO組', '蜜組', '喜樂組'] });

            // 管理員登入 Modal State
            const [password, setPassword] = useState('');
            const [isRegister, setIsRegister] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');
            const [authLoading, setAuthLoading] = useState(false);

            // Dashboard 內部 State
            const [activeTab, setActiveTab] = useState('stats'); 
            const [newGroup, setNewGroup] = useState('');
            const [usersList, setUsersList] = useState([]);
            const [loadingStats, setLoadingStats] = useState(false);

            // 編寫通知 State
            const [notifTitle, setNotifTitle] = useState('');
            const [notifBody, setNotifBody] = useState('');
            const [notifUrl, setNotifUrl] = useState('');
            const [publishing, setPublishing] = useState(false);

            let unsubscribeSettings = useRef(null);
            let unsubscribeProfile = useRef(null);

            useEffect(() => {
                let unsubscribeAuth = null;
                const initFirebase = async () => {
                    try {
                        const appModule = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js");
                        const authModule = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js");
                        const dbModule = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
                
                        const firebaseConfig = {
                            apiKey: "AIzaSyAEMB-eVojfzcUMyKt9JgGK_okPRO2V73g",
                            authDomain: "ccagkc-biblereading-project.firebaseapp.com",
                            databaseURL: "https://ccagkc-biblereading-project-default-rtdb.asia-southeast1.firebasedatabase.app",
                            projectId: "ccagkc-biblereading-project",
                            storageBucket: "ccagkc-biblereading-project.firebasestorage.app",
                            messagingSenderId: "962459311265",
                            appId: "1:962459311265:web:cbad43a46491a046e5e4e0"
                        };
                        
                        const app = appModule.initializeApp(firebaseConfig);
                        const auth = authModule.getAuth(app);
                        const db = dbModule.getFirestore(app);
                        const appId = 'ccagkc-ChurchCalendarApp'; 
                        
                        const fbObj = { auth, db, appId, authModule, dbModule };
                        setFb(fbObj);
                
                        const settingsRef = dbModule.doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'general');
                        unsubscribeSettings.current = dbModule.onSnapshot(settingsRef, (snap) => {
                            if (snap.exists()) setAppSettings(snap.data());
                        });

                        unsubscribeAuth = authModule.onAuthStateChanged(auth, (user) => {
                            if (unsubscribeProfile.current) unsubscribeProfile.current();
                        
                            if (user && user.email.endsWith(SITE_CONFIG.adminEmailDomain)) {
                                setCurrentUser(user);
                                const profileRef = dbModule.doc(db, 'artifacts', appId, 'public', 'data', 'userProfiles', user.uid);
                                unsubscribeProfile.current = dbModule.onSnapshot(profileRef, (snap) => {
                                    if (snap.exists()) {
                                        setUserProfile(snap.data());
                                    } else {
                                        setUserProfile({ username: '系統管理員', role: 'admin' });
                                    }
                                    setLoading(false);
                                });
                            } else {
                                setCurrentUser(null);
                                setUserProfile(null);
                                setLoading(false);
                            }
                        });

                    } catch (e) { 
                        console.error("Firebase 模組載入失敗", e); 
                        setLoading(false);
                    }
                };
                initFirebase();

                return () => { 
                    if (unsubscribeAuth) unsubscribeAuth();
                    if (unsubscribeSettings.current) unsubscribeSettings.current();
                    if (unsubscribeProfile.current) unsubscribeProfile.current();
                };
            }, []);

            // 抓取會友統計列表
            useEffect(() => {
                if (activeTab === 'stats' && fb && currentUser) {
                    setLoadingStats(true);
                    const fetchUsers = async () => {
                        try {
                            const usersCol = fb.dbModule.collection(fb.db, 'artifacts', fb.appId, 'public', 'data', 'userProfiles');
                            const snapshot = await fb.dbModule.getDocs(usersCol);
                            const list = [];
                            snapshot.forEach(doc => {
                                const data = doc.data();
                                if (data.role !== 'admin') list.push(data); 
                            });
                            setUsersList(list);
                        } catch (e) {
                            console.error("獲取統計資料失敗:", e.message);
                        } finally {
                            setLoadingStats(false);
                        }
                    };
                    fetchUsers();
                }
            }, [activeTab, fb, currentUser]);

            // 管理員登入/註冊處理
            const handleAdminAuth = async (e) => {
                e.preventDefault(); 
                setAuthLoading(true); 
                setErrorMsg(''); 
                const adminEmail = `admin${SITE_CONFIG.adminEmailDomain}`;

                try {
                    if (isRegister) {
                        const cred = await fb.authModule.createUserWithEmailAndPassword(fb.auth, adminEmail, password);
                        await fb.dbModule.setDoc(fb.dbModule.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'userProfiles', cred.user.uid), { username: '系統管理員', role: 'admin', createdAt: new Date().toISOString() });
                    } else {
                        const cred = await fb.authModule.signInWithEmailAndPassword(fb.auth, adminEmail, password);
                        const ref = fb.dbModule.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'userProfiles', cred.user.uid);
                        const snap = await fb.dbModule.getDoc(ref);
                        if (!snap.exists()) await fb.dbModule.setDoc(ref, { username: '系統管理員', role: 'admin', createdAt: new Date().toISOString() });
                    }
                } catch (err) { 
                    setErrorMsg('登入失敗：' + err.message); 
                } finally { 
                    setAuthLoading(false); 
                }
            };

            // 新增小組
            const handleAddGroup = async () => {
                if (!newGroup.trim() || appSettings.groups.includes(newGroup.trim())) return;
                const updated = [...appSettings.groups, newGroup.trim()];
                const settingsRef = fb.dbModule.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'settings', 'general');
                await fb.dbModule.setDoc(settingsRef, { groups: updated }, { merge: true });
                setNewGroup('');
                alert('✅ 小組已成功新增！');
            };

            // 刪除小組
            const handleRemoveGroup = async (groupName) => {
                if (!confirm(`確定要刪除小組「${groupName}」嗎？`)) return;
                const updated = appSettings.groups.filter(g => g !== groupName);
                const settingsRef = fb.dbModule.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'settings', 'general');
                await fb.dbModule.setDoc(settingsRef, { groups: updated }, { merge: true });
            };

            // 匯出 CSV 報表
            const handleExportCSV = () => {
                if (usersList.length === 0) {
                    alert("目前沒有數據可供匯出。");
                    return;
                }
                const headers = ['小組/牧區', '姓名/代號', '已讀天數', '最後活動日期', '註冊日期', '已開啟推播通知'];
                const rows = usersList.map(user => [
                    user.group || '未分類',
                    user.username || '無名',
                    user.completedCount || 0,
                    user.lastActive ? user.lastActive.substring(0, 10) : '無紀錄',
                    user.createdAt ? user.createdAt.substring(0, 10) : '無紀錄',
                    user.notificationsEnabled ? '是' : '否'
                ]);
                const csvContent = [
                    headers.join(','),
                    ...rows.map(row => row.map(field => `"${String(field).replace(/"/g, '""')}"`).join(','))
                ].join('\n');
                const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
                const blob = new Blob([bom, csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                const url = URL.createObjectURL(blob);
                const today = new Date();
                const dateStr = `${today.getFullYear()}${(today.getMonth()+1).toString().padStart(2, '0')}${today.getDate().toString().padStart(2, '0')}`;
                link.setAttribute('href', url);
                link.setAttribute('download', `葵涌堂_讀經進度統計_${dateStr}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            };

            // 發布通知至 Firestore
            const handlePublishNotification = async (e) => {
                e.preventDefault();
                if (!notifTitle.trim() || !notifBody.trim()) {
                    alert('請填寫通告標題與詳細內容！');
                    return;
                }

                setPublishing(true);
                try {
                    const notifCol = fb.dbModule.collection(
                        fb.db, 
                        'artifacts', fb.appId, 'public', 'data', 'notifications'
                    );

                    await fb.dbModule.addDoc(notifCol, {
                        title: notifTitle.trim(),
                        body: notifBody.trim(),
                        url: notifUrl.trim() || '',
                        createdAt: new Date().toISOString(),
                        publisher: userProfile?.username || '系統管理員'
                    });

                    alert('🎉 通告已成功寫入 Firestore 並同步至全教會歷史訊息牆！');
                    setNotifTitle('');
                    setNotifBody('');
                    setNotifUrl('');
                    setActiveTab('stats'); 
                } catch (err) {
                    console.error('寫入 Firestore 失敗:', err);
                    alert('發布失敗：' + err.message);
                } finally {
                    setPublishing(false);
                }
            };

            const groupedStats = usersList.reduce((acc, user) => {
                const group = user.group || '未分類';
                if (!acc[group]) acc[group] = [];
                acc[group].push(user);
                return acc;
            }, {});

            if (loading) return (
                <div className="flex-grow flex flex-col items-center justify-center text-slate-600 bg-slate-100 min-h-screen">
                    <i className="fa-solid fa-circle-notch fa-spin text-5xl mb-4 text-slate-700"></i>
                    <p className="font-bold tracking-widest text-lg">安全驗證中...</p>
                </div>
            );

            // 未登入管理員畫面
            if (!currentUser) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 bg-slate-900">
                        <div className="bg-white rounded-3xl w-full max-w-md shadow-2xl overflow-hidden animate-fade-in">
                            <div className="bg-slate-800 p-8 text-white text-center relative">
                                <div className="w-16 h-16 bg-slate-700 rounded-2xl flex items-center justify-center mx-auto mb-4 text-nature-400 text-2xl shadow-inner">
                                    <i className="fa-solid fa-shield-halved"></i>
                                </div>
                                <h2 className="text-2xl font-bold font-serif">葵涌堂悅曆</h2>
                                <p className="text-slate-400 text-xs mt-1 tracking-widest uppercase">管理員專用控制台</p>
                            </div>

                            <form onSubmit={handleAdminAuth} className="p-8 space-y-6">
                                {errorMsg && (
                                    <div className="text-red-600 text-sm bg-red-50 p-3.5 rounded-xl border border-red-100 font-medium">
                                        {errorMsg}
                                    </div>
                                )}

                                <div>
                                    <label className="block text-sm font-bold text-slate-700 mb-2">管理員安全密碼</label>
                                    <input 
                                        type="password" 
                                        value={password} 
                                        onChange={e=>setPassword(e.target.value)} 
                                        placeholder="請輸入密碼" 
                                        className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:border-slate-800 text-center font-bold tracking-widest text-xl" 
                                        required 
                                        autoFocus 
                                    />
                                </div>

                                <div className="flex items-center justify-center">
                                    <input 
                                        type="checkbox" 
                                        id="regAdmin" 
                                        checked={isRegister} 
                                        onChange={(e) => setIsRegister(e.target.checked)} 
                                        className="mr-2" 
                                    />
                                    <label htmlFor="regAdmin" className="text-xs text-slate-500 cursor-pointer">首次初始化設定密碼</label>
                                </div>

                                <button 
                                    type="submit" 
                                    disabled={authLoading} 
                                    className="w-full bg-slate-800 text-white font-bold py-4 rounded-2xl hover:bg-slate-700 transition shadow-lg active:scale-95 text-lg"
                                >
                                    {authLoading ? <i className="fa-solid fa-spinner fa-spin"></i> : (isRegister ? '初始化並登入' : '安全登入管理後台')}
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            // 已登入管理員畫面 (Admin Dashboard)
            return (
                <div className="min-h-screen flex flex-col bg-slate-100">
                    <header className="bg-slate-900 text-white p-6 shadow-md border-b border-slate-800">
                        <div className="max-w-6xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-nature-600 rounded-xl flex items-center justify-center text-white">
                                    <i className="fa-solid fa-server text-lg"></i>
                                </div>
                                <div>
                                    <h1 className="text-xl font-bold font-serif">葵涌堂悅曆 · 後台管理系統</h1>
                                    <p className="text-slate-400 text-xs">當前管理員：{userProfile?.username || currentUser.email}</p>
                                </div>
                            </div>

                            <button 
                                onClick={() => fb.authModule.signOut(fb.auth)} 
                                className="bg-slate-800 hover:bg-red-600 text-slate-300 hover:text-white px-4 py-2 rounded-xl text-xs font-bold transition border border-slate-700 flex items-center gap-2"
                            >
                                <i className="fa-solid fa-arrow-right-from-bracket"></i> 安全登出
                            </button>
                        </div>
                    </header>

                    <main className="flex-grow p-4 md:p-8 max-w-6xl mx-auto w-full">
                        <div className="bg-white rounded-3xl shadow-soft border border-slate-200/80 overflow-hidden min-h-[70vh]">
                            {/* 頂部 Tab 選單 */}
                            <div className="flex border-b border-slate-200 bg-slate-50/50">
                                <button 
                                    onClick={() => setActiveTab('stats')} 
                                    className={`flex-1 py-4 font-bold transition flex items-center justify-center gap-2 ${activeTab === 'stats' ? 'bg-white text-nature-700 border-b-2 border-nature-600 shadow-sm' : 'text-slate-500 hover:bg-slate-100'}`}
                                >
                                    <i className="fa-solid fa-chart-pie"></i> 參與統計
                                </button>
                                <button 
                                    onClick={() => setActiveTab('publish')} 
                                    className={`flex-1 py-4 font-bold transition flex items-center justify-center gap-2 ${activeTab === 'publish' ? 'bg-white text-nature-700 border-b-2 border-nature-600 shadow-sm' : 'text-slate-500 hover:bg-slate-100'}`}
                                >
                                    <i className="fa-solid fa-paper-plane"></i> 發布通告
                                </button>
                                <button 
                                    onClick={() => setActiveTab('settings')} 
                                    className={`flex-1 py-4 font-bold transition flex items-center justify-center gap-2 ${activeTab === 'settings' ? 'bg-white text-nature-700 border-b-2 border-nature-600 shadow-sm' : 'text-slate-500 hover:bg-slate-100'}`}
                                >
                                    <i className="fa-solid fa-users-gear"></i> 小組設定
                                </button>
                            </div>

                            <div className="p-6 md:p-8">
                                {/* Tab 1: 數據統計 */}
                                {activeTab === 'stats' && (
                                    <div className="animate-fade-in space-y-6">
                                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center bg-nature-50/50 p-6 rounded-2xl border border-nature-100 gap-4">
                                            <div>
                                                <h3 className="font-bold text-nature-900 text-lg">全教會參與數據彙整</h3>
                                                <p className="text-xs text-nature-700 mt-1">目前共有 {usersList.length} 位會友完成登記</p>
                                            </div>
                                            <button 
                                                onClick={handleExportCSV} 
                                                disabled={usersList.length === 0} 
                                                className="w-full md:w-auto bg-nature-600 hover:bg-nature-700 text-white px-5 py-3 rounded-xl font-bold transition shadow-md active:scale-95 disabled:opacity-50 flex items-center justify-center gap-2"
                                            >
                                                <i className="fa-solid fa-file-csv text-lg"></i> 匯出 Excel / CSV 報表
                                            </button>
                                        </div>

                                        {loadingStats ? (
                                            <div className="text-center py-20 text-slate-400">
                                                <i className="fa-solid fa-spinner fa-spin text-3xl mb-3 block"></i>
                                                載入會友數據中...
                                            </div>
                                        ) : Object.keys(groupedStats).length === 0 ? (
                                            <div className="text-center py-16 text-slate-400 bg-slate-50 rounded-2xl border border-dashed border-slate-200">
                                                目前還沒有任何使用者註冊紀錄。
                                            </div>
                                        ) : (
                                            Object.keys(groupedStats).sort().map(groupName => (
                                                <div key={groupName} className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                                    <div className="bg-slate-50 px-6 py-3 border-b border-slate-200 flex justify-between items-center">
                                                        <h4 className="font-bold text-slate-800 flex items-center gap-2">
                                                            <i className="fa-solid fa-users text-nature-600"></i> {groupName}
                                                        </h4>
                                                        <span className="bg-nature-600 text-white text-xs px-2.5 py-1 rounded-full font-bold">
                                                            {groupedStats[groupName].length} 人
                                                        </span>
                                                    </div>
                                                    <div className="divide-y divide-slate-100">
                                                        {groupedStats[groupName].sort((a,b) => (b.completedCount||0) - (a.completedCount||0)).map((user, idx) => (
                                                            <div key={idx} className="flex justify-between items-center p-4 hover:bg-slate-50/80 transition">
                                                                <div className="font-medium text-slate-700">
                                                                    {user.username} {user.notificationsEnabled && <i className="fa-solid fa-bell text-blue-500 ml-1.5 text-xs" title="已開啟推播"></i>}
                                                                </div>
                                                                <div className="text-sm flex items-center gap-4">
                                                                    <span className="text-slate-400 text-xs hidden md:inline">最後活動: {user.lastActive ? user.lastActive.substring(0,10) : '無紀錄'}</span>
                                                                    <span className="bg-emerald-50 text-emerald-700 border border-emerald-200 px-3 py-1 rounded-lg font-bold">
                                                                        已讀 {user.completedCount || 0} 天
                                                                    </span>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                )}

                                {/* Tab 2: 發布通告 */}
                                {activeTab === 'publish' && (
                                    <div className="max-w-2xl mx-auto bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200 animate-fade-in">
                                        <div className="flex items-center justify-between mb-6 border-b border-slate-100 pb-4">
                                            <h3 className="font-bold text-lg text-slate-800 border-l-4 border-nature-500 pl-3">
                                                發布全教會最新通告
                                            </h3>
                                            <span className="text-xs bg-nature-100 text-nature-800 font-bold px-3 py-1 rounded-full">
                                                即時同步 Firestore
                                            </span>
                                        </div>

                                        <form onSubmit={handlePublishNotification} className="space-y-5">
                                            <div>
                                                <label className="block text-sm font-bold text-slate-700 mb-1">
                                                    通告標題 <span className="text-red-500">*</span>
                                                </label>
                                                <input 
                                                    type="text" 
                                                    value={notifTitle} 
                                                    onChange={e => setNotifTitle(e.target.value)} 
                                                    placeholder="例如：主日崇拜特別安排 / 颱風防範通知" 
                                                    className="w-full p-3.5 border border-slate-200 rounded-xl focus:outline-none focus:border-nature-500 bg-slate-50/50 font-medium" 
                                                    required 
                                                />
                                            </div>

                                            <div>
                                                <label className="block text-sm font-bold text-slate-700 mb-1">
                                                    通告詳細內容 <span className="text-red-500">*</span>
                                                </label>
                                                <textarea 
                                                    value={notifBody} 
                                                    onChange={e => setNotifBody(e.target.value)} 
                                                    rows="5" 
                                                    placeholder="請輸入欲發布給會友的詳細通告文字內容..." 
                                                    className="w-full p-3.5 border border-slate-200 rounded-xl focus:outline-none focus:border-nature-500 bg-slate-50/50 leading-relaxed font-medium" 
                                                    required 
                                                ></textarea>
                                            </div>

                                            <div>
                                                <label className="block text-sm font-bold text-slate-700 mb-1">
                                                    相關專頁 / 日期連結 (選填)
                                                </label>
                                                <input 
                                                    type="text" 
                                                    value={notifUrl} 
                                                    onChange={e => setNotifUrl(e.target.value)} 
                                                    placeholder="例如：?date=2026-08-23 或 外部網址 https://..." 
                                                    className="w-full p-3.5 border border-slate-200 rounded-xl focus:outline-none focus:border-nature-500 bg-slate-50/50 text-sm" 
                                                />
                                                <p className="text-xs text-slate-400 mt-1.5">
                                                    💡 填入 <code className="bg-slate-100 px-1 rounded">?date=YYYY-MM-DD</code>，會友點擊通告即可秒速跳轉至該日期的經文動態！
                                                </p>
                                            </div>

                                            <button 
                                                type="submit" 
                                                disabled={publishing} 
                                                className="w-full bg-nature-600 hover:bg-nature-700 text-white font-bold py-4 rounded-xl transition-all shadow-md active:scale-95 disabled:opacity-50 mt-6 text-lg flex items-center justify-center gap-2"
                                            >
                                                {publishing ? (
                                                    <><i className="fa-solid fa-spinner fa-spin"></i> 發布中...</>
                                                ) : (
                                                    <><i className="fa-solid fa-paper-plane"></i> 確認發布通告至 Firestore</>
                                                )}
                                            </button>
                                        </form>
                                    </div>
                                )}

                                {/* Tab 3: 小組設定 */}
                                {activeTab === 'settings' && (
                                    <div className="max-w-2xl mx-auto space-y-8 animate-fade-in">
                                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                            <h3 className="font-bold text-lg mb-4 text-slate-800 border-l-4 border-nature-500 pl-3">新增小組 / 身份類別</h3>
                                            <div className="flex gap-2">
                                                <input 
                                                    type="text" 
                                                    value={newGroup} 
                                                    onChange={e=>setNewGroup(e.target.value)} 
                                                    placeholder="例如：約書亞團契" 
                                                    className="flex-1 p-3 border border-slate-200 rounded-xl focus:outline-none focus:border-nature-500" 
                                                />
                                                <button onClick={handleAddGroup} className="bg-nature-600 text-white px-6 font-bold rounded-xl hover:bg-nature-700 transition">新增</button>
                                            </div>
                                            <p className="text-xs text-slate-400 mt-2">新增後，前台會友在首次登記選單中將可以直接選擇此小組。</p>
                                        </div>

                                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                            <h3 className="font-bold text-lg mb-4 text-slate-800 border-l-4 border-nature-500 pl-3">現有小組列表</h3>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                                {appSettings.groups.map(g => (
                                                    <div key={g} className="flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-200">
                                                        <span className="font-medium text-slate-700">{g}</span>
                                                        <button onClick={() => handleRemoveGroup(g)} className="text-red-400 hover:text-red-600 hover:bg-red-50 p-2 rounded-lg transition" title="刪除小組">
                                                            <i className="fa-solid fa-trash-can"></i>
                                                        </button>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </main>

                    <footer className="py-6 bg-slate-900 text-center text-slate-500 text-xs mt-auto border-t border-slate-800">
                        <p>{SITE_CONFIG.footerText}</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
