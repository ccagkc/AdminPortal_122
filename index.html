<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>葵涌堂悅曆 · 管理員後台控制台</title>
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="robots" content="noindex, nofollow">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e3a8a">
    
    <link rel="stylesheet" href="style.css?v=6">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'serif': ['"Noto Serif TC"', 'serif'],
                        'sans': ['"Noto Sans TC"', 'sans-serif'],
                    },
                    colors: {
                        winblue: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                            950: '#172554'
                        }
                    },
                    boxShadow: { 'win': '0 10px 30px -5px rgba(30, 58, 138, 0.2)' },
                    animation: { 'fade-in': 'fadeIn 0.25s ease-out forwards' },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(6px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-200 text-slate-800 font-sans antialiased min-h-screen flex flex-col">
    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SITE_CONFIG = {
            adminEmailDomain: "@admin.kcc.app",
            footerText: "© CCAGKC · CHURCH CALENDAR ADMIN SYSTEM"
        };

        const getCurrentDateTimeLocal = () => {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            return `${year}-${month}-${day}T${hours}:${minutes}`;
        };

        const App = () => {
            const [fb, setFb] = useState(null);
            const [currentUser, setCurrentUser] = useState(null);
            const [userProfile, setUserProfile] = useState(null);
            const [loading, setLoading] = useState(true);

            const [appSettings, setAppSettings] = useState({ groups: ['未入組/其他', '少年崇拜', '奇行組', 'IMA組', '加利利奮青', '彼得組', '隨意行組', '葡萄果組', 'Spectrum組', '家靈一組', '7-11組', '清心組', 'ReConnect組', '基順ECO組', '蜜組', '喜樂組'] });

            const [password, setPassword] = useState('');
            const [isRegister, setIsRegister] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');
            const [authLoading, setAuthLoading] = useState(false);

            const [activeTab, setActiveTab] = useState('publish'); 
            const [newGroup, setNewGroup] = useState('');
            const [inviteCodeInput, setInviteCodeInput] = useState(''); // 🟢 邀請碼狀態
            const [usersList, setUsersList] = useState([]);
            const [loadingStats, setLoadingStats] = useState(false);

            const [notifTitle, setNotifTitle] = useState('');
            const [notifBody, setNotifBody] = useState('');
            const [notifUrl, setNotifUrl] = useState('');
            const [notifDateLocal, setNotifDateLocal] = useState(getCurrentDateTimeLocal());
            const [publishing, setPublishing] = useState(false);

            const [existingNotifs, setExistingNotifs] = useState([]);
            const [loadingNotifs, setLoadingStatsNotifs] = useState(false);

            let unsubscribeSettings = useRef(null);
            let unsubscribeProfile = useRef(null);
            let unsubscribeNotifList = useRef(null);

            // 🟢 將系統的邀請碼同步到輸入框顯示
            useEffect(() => {
                if (appSettings?.inviteCode) {
                    setInviteCodeInput(appSettings.inviteCode);
                } else if (appSettings && !appSettings.inviteCode) {
                    setInviteCodeInput('KCC2026'); // 預設值
                }
            }, [appSettings]);

            useEffect(() => {
                let unsubscribeAuth = null;
                const initFirebase = async () => {
                    try {
                        const nativeImport = new Function('url', 'return import(url)');
                        const [appModule, authModule, dbModule] = await Promise.all([
                            nativeImport("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js"),
                            nativeImport("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js"),
                            nativeImport("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js")
                        ]);
                
                        const firebaseConfig = {
                            apiKey: "AIzaSyAEMB-eVojfzcUMyKt9JgGK_okPRO2V73g",
                            authDomain: "ccagkc-biblereading-project.firebaseapp.com",
                            projectId: "ccagkc-biblereading-project",
                            storageBucket: "ccagkc-biblereading-project.firebasestorage.app",
                            messagingSenderId: "962459311265",
                            appId: "1:962459311265:web:cbad43a46491a046e5e4e0"
                        };
                        
                        const app = appModule.initializeApp(firebaseConfig);
                        const auth = authModule.getAuth(app);
                        const db = dbModule.getFirestore(app);
                        const appId = 'ccagkc-ChurchCalendarApp'; 
                        
                        const fbObj = { auth, db, appId, authModule, dbModule };
                        setFb(fbObj);
                
                        const settingsRef = dbModule.doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'general');
                        unsubscribeSettings.current = dbModule.onSnapshot(settingsRef, (snap) => {
                            if (snap.exists()) setAppSettings(snap.data());
                        });

                        unsubscribeAuth = authModule.onAuthStateChanged(auth, (user) => {
                            if (unsubscribeProfile.current) unsubscribeProfile.current();
                        
                            if (user && user.email.endsWith(SITE_CONFIG.adminEmailDomain)) {
                                setCurrentUser(user);
                                const profileRef = dbModule.doc(db, 'artifacts', appId, 'public', 'data', 'userProfiles', user.uid);
                                unsubscribeProfile.current = dbModule.onSnapshot(profileRef, (snap) => {
                                    if (snap.exists()) {
                                        setUserProfile(snap.data());
                                    } else {
                                        setUserProfile({ username: '系統管理員', role: 'admin' });
                                    }
                                    setLoading(false);
                                });
                            } else {
                                setCurrentUser(null);
                                setUserProfile(null);
                                setLoading(false);
                            }
                        });

                    } catch (e) { 
                        console.error("Firebase 模組載入失敗:", e); 
                        setLoading(false);
                    }
                };
                initFirebase();

                return () => { 
                    if (unsubscribeAuth) unsubscribeAuth();
                    if (unsubscribeSettings.current) unsubscribeSettings.current();
                    if (unsubscribeProfile.current) unsubscribeProfile.current();
                    if (unsubscribeNotifList.current) unsubscribeNotifList.current();
                };
            }, []);

            useEffect(() => {
                if (activeTab === 'stats' && fb && currentUser) {
                    setLoadingStats(true);
                    const fetchUsers = async () => {
                        try {
                            const usersCol = fb.dbModule.collection(fb.db, 'artifacts', fb.appId, 'public', 'data', 'userProfiles');
                            const snapshot = await fb.dbModule.getDocs(usersCol);
                            const list = [];
                            snapshot.forEach(doc => {
                                const data = doc.data();
                                if (data.role !== 'admin') list.push(data); 
                            });
                            setUsersList(list);
                        } catch (e) {
                            console.error("獲取統計資料失敗:", e.message);
                        } finally {
                            setLoadingStats(false);
                        }
                    };
                    fetchUsers();
                }
            }, [activeTab, fb, currentUser]);

            useEffect(() => {
                if (activeTab === 'manageNotifs' && fb && currentUser) {
                    setLoadingStatsNotifs(true);
                    const notifCol = fb.dbModule.collection(fb.db, 'artifacts', fb.appId, 'public', 'data', 'notifications');
                    const q = fb.dbModule.query(notifCol, fb.dbModule.orderBy('createdAt', 'desc'));
                    
                    unsubscribeNotifList.current = fb.dbModule.onSnapshot(q, (snapshot) => {
                        const list = [];
                        snapshot.forEach(doc => {
                            list.push({ id: doc.id, ...doc.data() });
                        });
                        setExistingNotifs(list);
                        setLoadingStatsNotifs(false);
                    }, (err) => {
                        console.error("載入通告失敗:", err);
                        setLoadingStatsNotifs(false);
                    });
                }
                return () => {
                    if (unsubscribeNotifList.current) unsubscribeNotifList.current();
                };
            }, [activeTab, fb, currentUser]);

            const handleAdminAuth = async (e) => {
                e.preventDefault(); 
                setAuthLoading(true); 
                setErrorMsg(''); 
                const adminEmail = `admin${SITE_CONFIG.adminEmailDomain}`;

                try {
                    if (isRegister) {
                        const cred = await fb.authModule.createUserWithEmailAndPassword(fb.auth, adminEmail, password);
                        await fb.dbModule.setDoc(fb.dbModule.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'userProfiles', cred.user.uid), { username: '系統管理員', role: 'admin', createdAt: new Date().toISOString() });
                    } else {
                        const cred = await fb.authModule.signInWithEmailAndPassword(fb.auth, adminEmail, password);
                        const ref = fb.dbModule.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'userProfiles', cred.user.uid);
                        const snap = await fb.dbModule.getDoc(ref);
                        if (!snap.exists()) await fb.dbModule.setDoc(ref, { username: '系統管理員', role: 'admin', createdAt: new Date().toISOString() });
                    }
                } catch (err) { 
                    console.error("管理員登入失敗詳細錯誤:", err);
                    setErrorMsg(`連線異常 (${err.code || err.message})`); 
                } finally { 
                    setAuthLoading(false); 
                }
            };

            const handleSignOut = async () => {
                if (fb && fb.auth) {
                    try {
                        await fb.authModule.signOut(fb.auth);
                    } catch (e) {
                        console.warn("登出異常:", e);
                    }
                }
                setPassword('');
                setErrorMsg('');
                setCurrentUser(null);
                setUserProfile(null);
                setActiveTab('publish');
            };

            // 🟢 新增：更新邀請碼功能
            const handleUpdateInviteCode = async () => {
                if (!inviteCodeInput.trim()) return alert('邀請碼不能為空！');
                try {
                    const settingsRef = fb.dbModule.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'settings', 'general');
                    await fb.dbModule.setDoc(settingsRef, { inviteCode: inviteCodeInput.trim().toUpperCase() }, { merge: true });
                    alert('✅ 系統邀請碼已成功更新！前台會友註冊時將立刻生效。');
                } catch (err) {
                    alert('更新失敗：' + err.message);
                }
            };

            const handleAddGroup = async () => {
                if (!newGroup.trim() || appSettings.groups.includes(newGroup.trim())) return;
                const updated = [...appSettings.groups, newGroup.trim()];
                const settingsRef = fb.dbModule.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'settings', 'general');
                await fb.dbModule.setDoc(settingsRef, { groups: updated }, { merge: true });
                setNewGroup('');
                alert('✅ 小組已成功新增！');
            };

            const handleRemoveGroup = async (groupName) => {
                if (!confirm(`確定要刪除小組「${groupName}」嗎？`)) return;
                const updated = appSettings.groups.filter(g => g !== groupName);
                const settingsRef = fb.dbModule.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'settings', 'general');
                await fb.dbModule.setDoc(settingsRef, { groups: updated }, { merge: true });
            };

            const handleExportCSV = () => {
                if (usersList.length === 0) {
                    alert("目前沒有數據可供匯出。");
                    return;
                }
                const headers = ['小組/牧區', '姓名/代號', '已讀天數', '最後活動日期', '註冊日期', '已開啟推播通知'];
                const rows = usersList.map(user => [
                    user.group || '未分類',
                    user.username || '無名',
                    user.completedCount || 0,
                    user.lastActive ? user.lastActive.substring(0, 10) : '無紀錄',
                    user.createdAt ? user.createdAt.substring(0, 10) : '無紀錄',
                    user.notificationsEnabled ? '是' : '否'
                ]);
                const csvContent = [
                    headers.join(','),
                    ...rows.map(row => row.map(field => `"${String(field).replace(/"/g, '""')}"`).join(','))
                ].join('\n');
                const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
                const blob = new Blob([bom, csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                const url = URL.createObjectURL(blob);
                const today = new Date();
                const dateStr = `${today.getFullYear()}${(today.getMonth()+1).toString().padStart(2, '0')}${today.getDate().toString().padStart(2, '0')}`;
                link.setAttribute('href', url);
                link.setAttribute('download', `葵涌堂_讀經進度統計_${dateStr}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            };

            const handlePublishNotification = async (e) => {
                e.preventDefault();
                if (!notifTitle.trim() || !notifBody.trim()) {
                    alert('請填寫通告標題與詳細內容！');
                    return;
                }

                setPublishing(true);
                try {
                    const isoCreatedAt = new Date(notifDateLocal).toISOString();
                    const notifCol = fb.dbModule.collection(
                        fb.db, 
                        'artifacts', fb.appId, 'public', 'data', 'notifications'
                    );

                    await fb.dbModule.addDoc(notifCol, {
                        title: notifTitle.trim(),
                        body: notifBody.trim(),
                        url: notifUrl.trim() || '',
                        createdAt: isoCreatedAt,
                        publisher: userProfile?.username || '系統管理員'
                    });

                    alert('🎉 通告已成功寫入 Firestore 並同步至全教會歷史訊息牆！');
                    setNotifTitle('');
                    setNotifBody('');
                    setNotifUrl('');
                    setNotifDateLocal(getCurrentDateTimeLocal());
                    setActiveTab('manageNotifs'); 
                } catch (err) {
                    console.error('寫入 Firestore 失敗:', err);
                    alert('發布失敗：' + err.message);
                } finally {
                    setPublishing(false);
                }
            };

            const handleDeleteNotification = async (docId, title) => {
                if (!confirm(`⚠️ 確定要刪除這則通告嗎？\n\n標題：「${title}」\n\n刪除後全教會會友的手機將無法再查閱此通告！`)) {
                    return;
                }

                try {
                    const docRef = fb.dbModule.doc(
                        fb.db, 
                        'artifacts', fb.appId, 'public', 'data', 'notifications', docId
                    );
                    await fb.dbModule.deleteDoc(docRef);
                    alert('🗑️ 該通告已成功刪除！');
                } catch (err) {
                    console.error('刪除通告失敗:', err);
                    alert('刪除失敗：' + err.message);
                }
            };

            const groupedStats = usersList.reduce((acc, user) => {
                const group = user.group || '未分類';
                if (!acc[group]) acc[group] = [];
                acc[group].push(user);
                return acc;
            }, {});

            if (loading) return (
                <div className="flex-grow flex flex-col items-center justify-center text-winblue-900 bg-slate-200 min-h-screen">
                    <i className="fa-solid fa-circle-notch fa-spin text-5xl mb-4 text-winblue-800"></i>
                    <p className="font-bold tracking-widest text-lg">Windows 管理員安全驗證中...</p>
                </div>
            );

            if (!currentUser) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 bg-winblue-950">
                        <div className="bg-white rounded-2xl w-full max-w-md shadow-win border-2 border-winblue-600 overflow-hidden animate-fade-in">
                            <div className="bg-gradient-to-r from-winblue-900 via-winblue-800 to-winblue-900 p-8 text-white text-center relative border-b-4 border-winblue-600">
                                <div className="w-16 h-16 bg-winblue-950 rounded-xl flex items-center justify-center mx-auto mb-4 text-winblue-200 text-3xl shadow-inner border border-winblue-700">
                                    <i className="fa-solid fa-window-restore"></i>
                                </div>
                                <h2 className="text-2xl font-bold font-serif">葵涌堂悅曆</h2>
                                <p className="text-winblue-200 text-xs mt-1 tracking-widest uppercase">系統管理控制台 (ADMIN CONSOLE)</p>
                            </div>

                            <form onSubmit={handleAdminAuth} className="p-8 space-y-6">
                                {errorMsg && (
                                    <div className="text-red-600 text-sm bg-red-50 p-3.5 rounded-xl border border-red-200 font-medium">
                                        {errorMsg}
                                    </div>
                                )}

                                <div>
                                    <label className="block text-sm font-bold text-winblue-900 mb-2">管理員安全密碼</label>
                                    <input 
                                        type="password" 
                                        value={password} 
                                        onChange={e=>setPassword(e.target.value)} 
                                        placeholder="請輸入管理密碼" 
                                        className="w-full p-4 bg-slate-50 border-2 border-winblue-200 rounded-xl focus:outline-none focus:border-winblue-600 text-center font-bold tracking-widest text-xl text-winblue-950" 
                                        required 
                                        autoComplete="current-password"
                                        autoFocus 
                                    />
                                </div>

                                <div className="flex items-center justify-center">
                                    <input 
                                        type="checkbox" 
                                        id="regAdmin" 
                                        checked={isRegister} 
                                        onChange={(e) => setIsRegister(e.target.checked)} 
                                        className="mr-2 text-winblue-600 focus:ring-winblue-500 rounded" 
                                    />
                                    <label htmlFor="regAdmin" className="text-xs text-slate-600 cursor-pointer font-medium">首次初始化設定帳號密碼</label>
                                </div>

                                <button 
                                    type="submit" 
                                    disabled={authLoading} 
                                    className="w-full bg-winblue-800 hover:bg-winblue-900 text-white font-bold py-4 rounded-xl transition shadow-md active:scale-95 text-lg border border-winblue-950"
                                >
                                    {authLoading ? <i className="fa-solid fa-spinner fa-spin"></i> : (isRegister ? '初始化並登入' : '安全登入管理後台')}
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col bg-slate-200 font-sans">
                    <header className="bg-winblue-900 text-white p-5 shadow-lg border-b-4 border-winblue-600 sticky top-0 z-50">
                        <div className="max-w-6xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-winblue-800 rounded-lg flex items-center justify-center text-white border border-winblue-600 shadow-inner">
                                    <i className="fa-solid fa-display text-lg"></i>
                                </div>
                                <div>
                                    <h1 className="text-xl font-bold font-serif tracking-wide">葵涌堂悅曆 · 管理控制台</h1>
                                    <p className="text-winblue-200 text-xs">當前管理員：{userProfile?.username || currentUser.email}</p>
                                </div>
                            </div>

                            <button 
                                onClick={handleSignOut} 
                                className="bg-winblue-950 hover:bg-red-700 text-winblue-100 hover:text-white px-4 py-2 rounded-lg text-xs font-bold transition border border-winblue-700 flex items-center gap-2 shadow-sm"
                            >
                                <i className="fa-solid fa-power-off"></i> 安全登出
                            </button>
                        </div>
                    </header>

                    <main className="flex-grow p-4 md:p-8 max-w-6xl mx-auto w-full">
                        <div className="bg-white rounded-2xl shadow-win border border-winblue-200 overflow-hidden min-h-[75vh]">
                            <div className="flex flex-wrap border-b-2 border-winblue-200 bg-winblue-50/80">
                                <button 
                                    onClick={() => setActiveTab('publish')} 
                                    className={`flex-1 min-w-[140px] py-3.5 px-4 font-bold transition flex items-center justify-center gap-2 border-r border-winblue-200 text-sm ${activeTab === 'publish' ? 'bg-white text-winblue-900 border-b-2 border-winblue-800 shadow-sm' : 'text-slate-600 hover:bg-winblue-100/60'}`}
                                >
                                    <i className="fa-solid fa-paper-plane text-winblue-600"></i> 發布通告
                                </button>
                                <button 
                                    onClick={() => setActiveTab('manageNotifs')} 
                                    className={`flex-1 min-w-[140px] py-3.5 px-4 font-bold transition flex items-center justify-center gap-2 border-r border-winblue-200 text-sm ${activeTab === 'manageNotifs' ? 'bg-white text-winblue-900 border-b-2 border-winblue-800 shadow-sm' : 'text-slate-600 hover:bg-winblue-100/60'}`}
                                >
                                    <i className="fa-solid fa-list-check text-winblue-600"></i> 刪除/管理通告
                                </button>
                                <button 
                                    onClick={() => setActiveTab('stats')} 
                                    className={`flex-1 min-w-[140px] py-3.5 px-4 font-bold transition flex items-center justify-center gap-2 border-r border-winblue-200 text-sm ${activeTab === 'stats' ? 'bg-white text-winblue-900 border-b-2 border-winblue-800 shadow-sm' : 'text-slate-600 hover:bg-winblue-100/60'}`}
                                >
                                    <i className="fa-solid fa-chart-pie text-winblue-600"></i> 參與統計
                                </button>
                                <button 
                                    onClick={() => setActiveTab('settings')} 
                                    className={`flex-1 min-w-[140px] py-3.5 px-4 font-bold transition flex items-center justify-center gap-2 text-sm ${activeTab === 'settings' ? 'bg-white text-winblue-900 border-b-2 border-winblue-800 shadow-sm' : 'text-slate-600 hover:bg-winblue-100/60'}`}
                                >
                                    <i className="fa-solid fa-users-gear text-winblue-600"></i> 系統與小組設定
                                </button>
                            </div>

                            <div className="p-6 md:p-8">
                                {/* 順位 1：發布通告 */}
                                {activeTab === 'publish' && (
                                    <div className="max-w-2xl mx-auto bg-white p-6 md:p-8 rounded-xl shadow-sm border border-winblue-200 animate-fade-in">
                                        <div className="flex items-center justify-between mb-6 border-b border-slate-200 pb-4">
                                            <h3 className="font-bold text-lg text-winblue-950 border-l-4 border-winblue-800 pl-3">
                                                撰寫並發布全教會最新通告
                                            </h3>
                                            <span className="text-xs bg-winblue-100 text-winblue-900 font-bold px-3 py-1 rounded-full">
                                                即時寫入 Firestore
                                            </span>
                                        </div>

                                        <form onSubmit={handlePublishNotification} className="space-y-5">
                                            <div>
                                                <label className="block text-sm font-bold text-slate-700 mb-1">
                                                    發布日期與時間 <span className="text-red-500">*</span>
                                                </label>
                                                <input 
                                                    type="datetime-local" 
                                                    value={notifDateLocal} 
                                                    onChange={e => setNotifDateLocal(e.target.value)} 
                                                    className="w-full p-3.5 border border-slate-300 rounded-xl focus:outline-none focus:border-winblue-600 bg-slate-50 font-medium text-slate-800" 
                                                    required 
                                                />
                                                <p className="text-xs text-slate-400 mt-1">系統將自動轉換為 ISO 8601 時間格式存入 Firestore 的 createdAt 欄位。</p>
                                            </div>

                                            <div>
                                                <label className="block text-sm font-bold text-slate-700 mb-1">
                                                    通告標題 <span className="text-red-500">*</span>
                                                </label>
                                                <input 
                                                    type="text" 
                                                    value={notifTitle} 
                                                    onChange={e => setNotifTitle(e.target.value)} 
                                                    placeholder="例如：主日崇拜特別安排 / 颱風防範通知" 
                                                    className="w-full p-3.5 border border-slate-300 rounded-xl focus:outline-none focus:border-winblue-600 bg-slate-50 font-medium" 
                                                    required 
                                                />
                                            </div>

                                            <div>
                                                <label className="block text-sm font-bold text-slate-700 mb-1">
                                                    通告詳細內容 <span className="text-red-500">*</span>
                                                </label>
                                                <textarea 
                                                    value={notifBody} 
                                                    onChange={e => setNotifBody(e.target.value)} 
                                                    rows="5" 
                                                    placeholder="請輸入欲發布給會友的詳細通告文字內容..." 
                                                    className="w-full p-3.5 border border-slate-300 rounded-xl focus:outline-none focus:border-winblue-600 bg-slate-50 leading-relaxed font-medium" 
                                                    required 
                                                ></textarea>
                                            </div>

                                            <div>
                                                <label className="block text-sm font-bold text-slate-700 mb-1">
                                                    相關專頁 / 日期連結 (選填)
                                                </label>
                                                <input 
                                                    type="text" 
                                                    value={notifUrl} 
                                                    onChange={e => setNotifUrl(e.target.value)} 
                                                    placeholder="例如：?date=2026-08-23 或 外部網址 https://..." 
                                                    className="w-full p-3.5 border border-slate-300 rounded-xl focus:outline-none focus:border-winblue-600 bg-slate-50 text-sm" 
                                                />
                                                <p className="text-xs text-slate-400 mt-1.5">
                                                    💡 填入 <code className="bg-slate-100 px-1 rounded border">?date=YYYY-MM-DD</code>，會友點擊通告即可秒速跳轉至該日期的經文動態！
                                                </p>
                                            </div>

                                            <button 
                                                type="submit" 
                                                disabled={publishing} 
                                                className="w-full bg-winblue-800 hover:bg-winblue-900 text-white font-bold py-4 rounded-xl transition-all shadow-md active:scale-95 disabled:opacity-50 mt-6 text-lg flex items-center justify-center gap-2 border border-winblue-950"
                                            >
                                                {publishing ? (
                                                    <><i className="fa-solid fa-spinner fa-spin"></i> 發布中...</>
                                                ) : (
                                                    <><i className="fa-solid fa-paper-plane"></i> 發布至月曆網頁</>
                                                )}
                                            </button>
                                        </form>
                                    </div>
                                )}

                                {/* 順位 2：管理/刪除通告 */}
                                {activeTab === 'manageNotifs' && (
                                    <div className="space-y-6 animate-fade-in">
                                        <div className="flex justify-between items-center bg-winblue-50 p-6 rounded-xl border border-winblue-200">
                                            <div>
                                                <h3 className="font-bold text-winblue-950 text-lg">歷史通告管理</h3>
                                                <p className="text-xs text-winblue-800 mt-1">目前 Firestore 中共有 {existingNotifs.length} 則已發布的通告</p>
                                            </div>
                                        </div>

                                        {loadingNotifs ? (
                                            <div className="text-center py-20 text-slate-400">
                                                <i className="fa-solid fa-spinner fa-spin text-3xl mb-3 block text-winblue-800"></i>
                                                載入歷史通告列表中...
                                            </div>
                                        ) : existingNotifs.length === 0 ? (
                                            <div className="text-center py-16 text-slate-400 bg-slate-50 rounded-xl border border-dashed border-slate-300">
                                                目前資料庫中沒有任何通告紀錄。
                                            </div>
                                        ) : (
                                            <div className="space-y-4">
                                                {existingNotifs.map((item) => {
                                                    const dateStr = item.createdAt ? new Date(item.createdAt).toLocaleString('zh-HK', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }) : '無時間紀錄';
                                                    return (
                                                        <div key={item.id} className="bg-white rounded-xl p-6 shadow-sm border border-slate-200 hover:border-winblue-400 transition relative flex flex-col md:flex-row justify-between md:items-center gap-4">
                                                            <div className="space-y-2 flex-1">
                                                                <div className="flex items-center gap-3">
                                                                    <span className="bg-winblue-100 text-winblue-900 text-xs px-3 py-1 rounded-full font-bold shrink-0">
                                                                        {dateStr}
                                                                    </span>
                                                                    <h4 className="font-bold text-slate-800 text-base">{item.title || '（無標題）'}</h4>
                                                                </div>
                                                                <p className="text-sm text-slate-600 leading-relaxed whitespace-pre-wrap pl-2 border-l-2 border-winblue-200">
                                                                    {item.body}
                                                                </p>
                                                                {item.url && <p className="text-xs text-winblue-700 font-mono">連結: {item.url}</p>}
                                                            </div>

                                                            <button 
                                                                onClick={() => handleDeleteNotification(item.id, item.title)}
                                                                className="bg-red-50 hover:bg-red-600 text-red-600 hover:text-white font-bold px-4 py-2.5 rounded-xl transition border border-red-200 flex items-center justify-center gap-2 text-sm shrink-0"
                                                            >
                                                                <i className="fa-solid fa-trash-can"></i> 刪除通告
                                                            </button>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* 順位 3：數據統計 */}
                                {activeTab === 'stats' && (
                                    <div className="animate-fade-in space-y-6">
                                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center bg-winblue-50 p-6 rounded-xl border border-winblue-200 gap-4">
                                            <div>
                                                <h3 className="font-bold text-winblue-950 text-lg">全教會參與數據彙整</h3>
                                                <p className="text-xs text-winblue-800 mt-1">目前共有 {usersList.length} 位會友完成登記</p>
                                            </div>
                                            <button 
                                                onClick={handleExportCSV} 
                                                disabled={usersList.length === 0} 
                                                className="w-full md:w-auto bg-winblue-800 hover:bg-winblue-900 text-white px-5 py-3 rounded-xl font-bold transition shadow-md active:scale-95 disabled:opacity-50 flex items-center justify-center gap-2 border border-winblue-950"
                                            >
                                                <i className="fa-solid fa-file-csv text-lg"></i> 匯出 Excel / CSV 報表
                                            </button>
                                        </div>

                                        {loadingStats ? (
                                            <div className="text-center py-20 text-slate-400">
                                                <i className="fa-solid fa-spinner fa-spin text-3xl mb-3 block text-winblue-800"></i>
                                                載入會友數據中...
                                            </div>
                                        ) : Object.keys(groupedStats).length === 0 ? (
                                            <div className="text-center py-16 text-slate-400 bg-slate-50 rounded-xl border border-dashed border-slate-300">
                                                目前還沒有任何使用者註冊紀錄。
                                            </div>
                                        ) : (
                                            Object.keys(groupedStats).sort().map(groupName => (
                                                <div key={groupName} className="bg-white rounded-xl shadow-sm border border-winblue-100 overflow-hidden">
                                                    <div className="bg-winblue-50/60 px-6 py-3 border-b border-winblue-200 flex justify-between items-center">
                                                        <h4 className="font-bold text-winblue-950 flex items-center gap-2">
                                                            <i className="fa-solid fa-users text-winblue-700"></i> {groupName}
                                                        </h4>
                                                        <span className="bg-winblue-800 text-white text-xs px-2.5 py-1 rounded-full font-bold">
                                                            {groupedStats[groupName].length} 人
                                                        </span>
                                                    </div>
                                                    <div className="divide-y divide-slate-100">
                                                        {groupedStats[groupName].sort((a,b) => (b.completedCount||0) - (a.completedCount||0)).map((user, idx) => (
                                                            <div key={idx} className="flex justify-between items-center p-4 hover:bg-winblue-50/30 transition">
                                                                <div className="font-medium text-slate-700">
                                                                    {user.username} {user.notificationsEnabled && <i className="fa-solid fa-bell text-winblue-600 ml-1.5 text-xs" title="已開啟推播"></i>}
                                                                </div>
                                                                <div className="text-sm flex items-center gap-4">
                                                                    <span className="text-slate-400 text-xs hidden md:inline">最後活動: {user.lastActive ? user.lastActive.substring(0,10) : '無紀錄'}</span>
                                                                    <span className="bg-emerald-50 text-emerald-700 border border-emerald-200 px-3 py-1 rounded-lg font-bold">
                                                                        已讀 {user.completedCount || 0} 天
                                                                    </span>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                )}

                                {/* 順位 4：小組設定 */}
                                {activeTab === 'settings' && (
                                    <div className="max-w-2xl mx-auto space-y-8 animate-fade-in">
                                        
                                        {/* 🟢 新增：系統註冊邀請碼設定 */}
                                        <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                                            <h3 className="font-bold text-lg mb-4 text-winblue-950 border-l-4 border-winblue-800 pl-3">系統註冊邀請碼設定</h3>
                                            <div className="flex gap-2">
                                                <input 
                                                    type="text" 
                                                    value={inviteCodeInput} 
                                                    onChange={e=>setInviteCodeInput(e.target.value)} 
                                                    placeholder="請設定新邀請碼" 
                                                    className="flex-1 p-3 border border-slate-300 rounded-xl focus:outline-none focus:border-winblue-600 uppercase font-bold tracking-widest text-winblue-900" 
                                                />
                                                <button onClick={handleUpdateInviteCode} className="bg-winblue-800 text-white px-6 font-bold rounded-xl hover:bg-winblue-900 transition border border-winblue-950">更新邀請碼</button>
                                            </div>
                                            <p className="text-xs text-slate-400 mt-2">新會友在首次登記時，必須輸入此密碼才能成功註冊。修改後立即生效。</p>
                                        </div>

                                        <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                                            <h3 className="font-bold text-lg mb-4 text-winblue-950 border-l-4 border-winblue-800 pl-3">新增小組 / 身份類別</h3>
                                            <div className="flex gap-2">
                                                <input 
                                                    type="text" 
                                                    value={newGroup} 
                                                    onChange={e=>setNewGroup(e.target.value)} 
                                                    placeholder="例如：約書亞團契" 
                                                    className="flex-1 p-3 border border-slate-300 rounded-xl focus:outline-none focus:border-winblue-600" 
                                                />
                                                <button onClick={handleAddGroup} className="bg-winblue-800 text-white px-6 font-bold rounded-xl hover:bg-winblue-900 transition border border-winblue-950">新增</button>
                                            </div>
                                            <p className="text-xs text-slate-400 mt-2">新增後，前台會友在首次登記選單中將可以直接選擇此小組。</p>
                                        </div>

                                        <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                                            <h3 className="font-bold text-lg mb-4 text-winblue-950 border-l-4 border-winblue-800 pl-3">現有小組列表</h3>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                                {appSettings.groups.map(g => (
                                                    <div key={g} className="flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-200">
                                                        <span className="font-medium text-slate-700">{g}</span>
                                                        <button onClick={() => handleRemoveGroup(g)} className="text-red-500 hover:text-red-700 hover:bg-red-50 p-2 rounded-lg transition" title="刪除小組">
                                                            <i className="fa-solid fa-trash-can"></i>
                                                        </button>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                    </div>
                                )}
                            </div>
                        </div>
                    </main>

                    <footer className="py-6 bg-winblue-950 text-center text-winblue-200 text-xs mt-auto border-t border-winblue-900">
                        <p>{SITE_CONFIG.footerText}</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
